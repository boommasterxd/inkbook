version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "@codemirror/state"
      - dependency-name: "@codemirror/view"
      # Keep declarations aligned with the approved Node.js 24 runtime.
      # Reassess when a reviewed Node.js LTS upgrade advances the runtime major.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # The CI import graph and supported lint/architecture tools use the TS6 API.
      # Remove after the complete stable TS7 toolchain is supported and verified.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
