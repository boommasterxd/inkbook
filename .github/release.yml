changelog:
  exclude:
    labels: [ignore-for-release]
  categories:
    - title: Features
      labels: [feature, enhancement]
    - title: Bug fixes
      labels: [bug, fix]
    - title: CI and build
      labels: [ci, build, github-actions]
    - title: Dependencies
      labels: [dependencies]
    - title: Documentation
      labels: [documentation, docs]
    - title: Other changes
      labels: ["*"]
