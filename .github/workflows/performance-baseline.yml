name: Advance performance baseline

on:
  push:
    branches: [main]

concurrency:
  group: performance-baseline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Advance proven performance baseline
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Check out merged trusted code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate evidence and atomically advance baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/performance-baseline-promote.mjs
