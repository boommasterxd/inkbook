name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run ci:quality

  Performance:
    name: Performance (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - label: shared
            suite: shared
            refresh-rate: "120"
            timeout_minutes: 10
          - label: refresh profiles
            suite: cadence
            refresh-rate: "120"
            timeout_minutes: 10
    env:
      INKBOOK_PERFORMANCE_MODE: gate
      INKBOOK_PERFORMANCE_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      INKBOOK_PERFORMANCE_REFRESH_RATE: ${{ matrix.refresh-rate }}
      INKBOOK_PERFORMANCE_SUITE: ${{ matrix.suite }}
      INKBOOK_PERFORMANCE_RESULTS_DIR: /tmp/inkbook-performance
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run performance gate
        run: npm run benchmark
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-${{ matrix.label }}
          path: /tmp/inkbook-performance
          retention-days: 1
          if-no-files-found: error
