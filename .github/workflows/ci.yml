name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run quality gate
        run: npm run ci:quality

  Performance:
    name: Performance (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        include:
          - label: shared
            suite: shared
            refresh-rate: "120"
            timeout_minutes: 20
          - label: refresh profiles
            suite: cadence
            refresh-rate: "120"
            timeout_minutes: 20
    env:
      INKBOOK_PERFORMANCE_REFRESH_RATE: ${{ matrix.refresh-rate }}
      INKBOOK_PERFORMANCE_SUITE: ${{ matrix.suite }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run performance gate
        run: npm run benchmark
