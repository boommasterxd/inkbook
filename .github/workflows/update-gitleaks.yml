name: Update gitleaks

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

# Serialize scheduled and manual updates, including runs on different refs.
# Do not cancel an active update when another run is triggered.
concurrency:
  group: update-gitleaks
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update pinned gitleaks version
        id: update
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(jq -r '.version' .gitleaks-version)
          latest_tag=$(gh api repos/gitleaks/gitleaks/releases/latest --jq '.tag_name')
          latest=${latest_tag#v}
          if [[ ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $latest_tag" >&2
            exit 1
          fi
          if [[ "$latest" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="dependencies/update-gitleaks-${latest}"
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
            --state open --json number --jq 'length')
          if [[ ! "$open_prs" =~ ^[0-9]+$ ]]; then
            echo "Invalid open pull request count." >&2
            exit 1
          fi
          if [[ "$open_prs" != "0" ]]; then
            echo "An update pull request already exists."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > /dev/null; then
            echo "An update branch already exists."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            status=$?
            if [[ "$status" != "2" ]]; then
              echo "Could not inspect the remote update branch." >&2
              exit "$status"
            fi
          fi
          checksums="$RUNNER_TEMP/gitleaks-checksums.txt"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${latest}/gitleaks_${latest}_checksums.txt" \
            --output "$checksums"
          checksum=$(awk -v file="gitleaks_${latest}_linux_x64.tar.gz" '$2 == file { print $1 }' "$checksums")
          if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Missing or invalid release checksum." >&2
            exit 1
          fi
          jq --arg version "$latest" --arg sha256 "$checksum" \
            '.version = $version | .sha256 = $sha256' \
            .gitleaks-version > "$RUNNER_TEMP/gitleaks-version"
          cp "$RUNNER_TEMP/gitleaks-version" .gitleaks-version
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$latest" >> "$GITHUB_OUTPUT"
      - name: Open update pull request
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          branch="dependencies/update-gitleaks-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add .gitleaks-version
          git commit --message "chore(deps): update gitleaks to ${VERSION}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --label dependencies \
            --title "chore(deps): update gitleaks to ${VERSION}" \
            --body "$(printf '%s\n' \
              '## Problem' \
              '' \
              "The pinned gitleaks CLI is older than the current upstream release ${VERSION}." \
              '' \
              '## Solution' \
              '' \
              "Update .gitleaks-version to ${VERSION} and its upstream Linux x64 archive checksum." \
              '' \
              '## Verification' \
              '' \
              'The updater accepted an x.y.z release tag and an exact 64-character lowercase hexadecimal checksum from the upstream checksums file. The required gitleaks check downloads the archive, verifies that pinned checksum, and scans the repository before merge.')"
