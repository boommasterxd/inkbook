name: Secret scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              for commit in "$PR_BASE_SHA" "$PR_HEAD_SHA"; do
                if [[ ! "$commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  echo "Invalid or missing pull request commit SHA." >&2
                  exit 1
                fi
                git cat-file -e "${commit}^{commit}"
              done
              policy_revision="$PR_BASE_SHA"
              log_options="${PR_BASE_SHA}..${PR_HEAD_SHA}"
              ;;
            workflow_dispatch)
              policy_revision=HEAD
              log_options="--all"
              ;;
            *) echo "Unsupported secret-scan event." >&2; exit 1 ;;
          esac

          manifest="$RUNNER_TEMP/gitleaks-version.json"
          policy="$RUNNER_TEMP/gitleaks.toml"
          git cat-file blob "${policy_revision}:.gitleaks-version" > "$manifest"
          git cat-file blob "${policy_revision}:.gitleaks.toml" > "$policy"
          version=$(jq -er '.version | select(test("\\A[0-9]+\\.[0-9]+\\.[0-9]+\\z"))' "$manifest")
          checksum=$(jq -er '.sha256 | select(test("\\A[a-f0-9]{64}\\z"))' "$manifest")
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          binary="$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 --silent --show-error --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

          # Gitleaks also loads source/.gitleaksignore independently of its flag.
          # Inkbook has no approved fingerprints. Git history still scans the file.
          rm -f .gitleaksignore
          scan_options=(--config "$policy" --gitleaks-ignore-path /dev/null --ignore-gitleaks-allow
            --no-banner --redact --exit-code 1 --verbose)
          "$binary" dir "${scan_options[@]}" .
          "$binary" git "${scan_options[@]}" --log-opts="$log_options" .
