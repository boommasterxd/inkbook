name: Release

on:
  push:
    tags: ["*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify release version
        shell: bash
        run: |
          tag=${GITHUB_REF_NAME}
          manifest_version=$(jq -r '.version' manifest.json)
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use x.y.z without a leading v." >&2
            exit 1
          fi
          if [[ "$tag" != "$manifest_version" ]]; then
            echo "Release tag and manifest version must match." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run release quality gate
        run: npm run ci
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/main.js dist/manifest.json dist/styles.css
          --generate-notes
          --title "$GITHUB_REF_NAME"
          --verify-tag
