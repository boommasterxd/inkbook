name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Existing protected release tag version without v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build draft release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.7.0"
          cache: npm

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Validate release identity
        id: identity
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest_version="$(jq --raw-output .version manifest.json)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$REQUESTED_VERSION"
            tag_commit="$(git rev-list -n 1 "v${version}")"
            test "$tag_commit" = "$GITHUB_SHA"
          fi
          test "$version" = "$manifest_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run release quality lane
        run: npm run ci

      - name: Build release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          cd dist
          sha256sum main.js manifest.json styles.css > SHA256SUMS

      - name: Validate required Phase 0 performance evidence
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test -s artifacts/performance-evidence.json
          npm run performance:evidence:check -- \
            --evidence artifacts/performance-evidence.json \
            --tag "v${VERSION}"

      - name: Create immutable draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists" >&2
            exit 1
          fi
          gh release create "v${VERSION}" \
            dist/main.js dist/manifest.json dist/styles.css dist/SHA256SUMS \
            --draft \
            --title "Inkbook ${VERSION}" \
            --notes "Draft release generated from the protected v${VERSION} tag."
